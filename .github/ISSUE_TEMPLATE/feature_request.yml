name: Feature request
description: Suggest something Quire should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Many features fit best in an extension, which anyone can write without changing Quire; see [writing an extension](https://github.com/quirecms/framework/blob/main/docs/extensions.md). Requests that need changes to Quire itself, e.g. a new extender or event, are welcome here.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe what you're trying to do and what stands in the way, rather than a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: E.g. an extension, or a workaround you use today.
